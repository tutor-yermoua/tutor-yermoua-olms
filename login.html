<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເຂົ້າສູ່ລະບົບ & ລົງທະບຽນ - OLMS</title>
    <!-- ໂຫຼດຟອນ Noto Sans Lao ຈາກ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ເຊື່ອມຕໍ່ໄຟລ໌ CSS ທີ່ແຍກອອກມາ -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ພື້ນຫຼັງເສັ້ນໂຄ້ງສີຟ້າ -->
    <div class="bg-wave">
        <svg viewBox="0 0 500 500" preserveAspectRatio="none">
            <path d="M-50,50 C150,150 150,300 250,200 C350,100 400,350 550,400 L500,0 L0,0 Z" fill="url(#grad1)" opacity="0.12"></path>
            <path d="M-20,100 C120,220 200,80 320,180 C440,280 480,100 550,50 L500,0 L0,0 Z" fill="url(#grad1)" opacity="0.2"></path>
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0022cc;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#0044ff;stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <!-- ================= 1. ຟອມເຂົ້າສູ່ລະບົບ (LOGIN) ================= -->
    <div class="auth-container" id="loginBox">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>ເຂົ້າສູ່ລະບົບ</h2>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>ຊື່ຜູ້ໃຊ້</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user icon-left"></i>
                    <input type="text" id="loginUsername" placeholder="ກະລຸນາປ້ອນຊື່ຜູ້ໃຊ້" required>
                </div>
            </div>

            <div class="form-group">
                <label>ລະຫັດຜ່ານ</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="loginPassword" placeholder="ກະລຸນາປ້ອນລະຫັດຜ່ານ" required>
                    <i class="fa-solid fa-eye-slash icon-right" onclick="togglePassword('loginPassword', this)"></i>
                </div>
            </div>

            <div class="extra-actions">
                <label class="remember-me">
                    <input type="checkbox"> ຈື່ຂ້ອຍໄວ້
                </label>
               <a href="#" class="forgot-password" onclick="switchForm('forgot')">ລືມລະຫັດຜ່ານ?</a>
            </div>

            <button type="submit" class="btn-submit">ເຂົ້າສູ່ລະບົບ</button>
            
        </form>
    </div>
        <!-- ຟອມລືມລະຫັດຜ່ານ ແລະ OTP (ເຊື່ອງໄວ້ກ່ອນ) -->
        <div class="auth-container" id="forgotBox" style="display: none;">
            
            <!-- ບາດກ້າວ 1: ໃສ່ອີເມວ -->
            <div id="step-email-form">
                <h3>ລືມລະຫັດຜ່ານ</h3>
                <p style="color: #6b7280; font-size: 14px; margin-bottom: 15px; text-align: left;">ໃສ່ອີເມວຂອງທ່ານ ເພື່ອປ່ຽນລະຫັດຜ່ານໃໝ່</p>
                <div class="input-group" style="margin-bottom: 15px;">
                    <input type="email" id="reset-email" placeholder="ປ້ອນອີເມວຂອງທ່ານ..." style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>
                <button type="button" class="btn-submit" onclick="requestOTP()">ຂໍລະຫັດ OTP</button>
                <div class="switch-link" style="margin-top: 15px; text-align: center;">
                    ມີບັນຊີຢູ່ແລ້ວ?<a href="#" onclick="switchForm('login')">ເຂົ້າສູ່ລະບົບ</a>
                </div>
                
            </div>

            <!-- ບາດກ້າວ 2: ຢືນຢັນ OTP -->
            <div id="step-otp-form" style="display: none;">
                <h3 style="text-align: center; margin-bottom: 8px;">ຢືນຢັນລະຫັດ OTP</h3>
                <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px; text-align: center;">ລະຫັດ 6 ຫຼັກຖືກສົ່ງໄປທີ່ອີເມວແລ້ວ</p>
                
                <div class="input-group" style="margin-bottom: 20px;">
                    <input type="text" id="otp-code" placeholder="______" maxlength="6" autocomplete="off" inputmode="numeric"
                        style="width: 100%; padding: 14px 10px; text-align: center; letter-spacing: 14px; padding-left: 24px; font-size: 24px; font-weight: 700; color: #0022cc; border: 2px solid #cbd5e1; border-radius: 12px; background-color: #f8fafc; outline: none; transition: all 0.2s;">
                </div>

                <button type="button" class="btn-submit" onclick="verifyOTP()">ຢືນຢັນ OTP</button>
                
                <div class="switch-link" style="margin-top: 15px; text-align: center;">
                    <a href="#" onclick="switchForm('forgot')">ສົ່ງລະຫັດອີກຄັ້ງ</a>
                </div>
            </div>

            <!-- ບາດກ້າວ 3: ຕັ້ງລະຫັດຜ່ານໃໝ່ -->
            <div id="step-new-pass-form" style="display: none;">
                <h3>ຕັ້ງລະຫັດຜ່ານໃໝ່</h3>
                <div class="input-group" style="margin-bottom: 15px;">
                    <input type="password" id="new-password" placeholder="ລະຫັດຜ່ານໃໝ່" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>
                <div class="input-group" style="margin-bottom: 15px;">
                    <input type="password" id="confirm-password" placeholder="ຢືນຢັນລະຫັດຜ່ານໃໝ່" style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px;">
                </div>
                <button type="button" class="btn-submit" onclick="resetPassword()">ບັນທຶກລະຫັດຜ່ານ</button>
            </div>

        </div>

    <!-- ================= Loading & Success Modal ສຳລັບ Login ================= -->
    <div id="loadingModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #ffffff; padding: 30px 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 280px;">
            <div id="spinnerContainer" style="margin-bottom: 15px;">
                <div class="spinner" style="width: 45px; height: 45px; border: 4px solid #e2e8f0; border-top: 4px solid #0022cc; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto;"></div>
            </div>
            <div id="successCheck" style="display: none; margin-bottom: 15px;">
                <div style="width: 45px; height: 45px; background: #22c55e; color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; margin: 0 auto; box-shadow: 0 4px 10px rgba(34,197,94,0.3);">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
            <p id="loadingText" style="font-size: 15px; font-weight: 600; color: #1e293b; margin: 0;">
                ກຳລັງເຂົ້າສູ່ລະບົບ<span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </p>
        </div>
    </div>


    <!-- ເຊື່ອມຕໍ່ໄຟລ໌ JavaScript ທີ່ແຍກອອກມາ -->
    <script src="login.js"></script>
</body>
</html>
